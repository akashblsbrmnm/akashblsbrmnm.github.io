{{ define "main" }}
<div class="home-shell">
  <div class="home-top">
    {{ partial "nav.html" . }}
  </div>

  <aside class="resume-sidebar" aria-label="Profile">
    {{ partial "sidebar-profile.html" . }}
  </aside>

  <main id="main" class="resume-main__sections" tabindex="-1">
    {{ partial "about.html" . }}
    {{ partial "experience.html" . }}
    {{ partial "skills.html" . }}
    {{ partial "projects.html" . }}
    {{ partial "blog-preview.html" . }}
    {{ partial "contact.html" . }}
  </main>
</div>
{{ end }}
