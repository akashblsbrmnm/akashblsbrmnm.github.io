{{ $s := hugo.Data.site }}
<section class="section about" id="about" aria-labelledby="about-heading">
  <div class="wrap">
    <div class="about__layout">
      <p class="about__label section__label section__label--accent">01 / WHOMAI</p>
      <h2 id="about-heading" class="about__heading">Background</h2>
      <div class="about__copy">
        {{ range $s.about }}
        <p>{{ . }}</p>
        {{ end }}
        <div class="about__actions">
          {{ with $s.email }}
          <a class="about__btn" href="mailto:{{ . }}">{{ . }}</a>
          {{ end }}
          <a class="about__btn" href="{{ $s.linkedin }}" rel="noopener">
            {{ partial "icon.html" "linkedin" }}
            LinkedIn
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
